<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>رحلة اليوم | اكتشف رام الله</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <h1> AroundMe BirZeit</h1>
    <p>مطاعم • كافيهات • حدائق • رياضة</p>

    <div class="actions">
      <button id="getLocationBtn">📍 قريب مني</button>
      <input id="searchInput" type="text" placeholder="ابحث عن مكان...">
    </div>
  </section>

  <!-- CATEGORIES -->
  <section class="categories">
    <button class="cat active" data-type="ALL">الكل</button>
    <button class="cat" data-type="Restaurant">🍽️ مطاعم</button>
    <button class="cat" data-type="Cafe">☕ كافيهات</button>
    <button class="cat" data-type="Park">🌳 حدائق</button>
    <button class="cat" data-type="Gym">🏋️ رياضة</button>
  </section>

  <!-- RESULTS -->
  <section id="results"></section>

  <!-- MAP -->
  <div id="map"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>

</body>
</html>
