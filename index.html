<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ramallah Waste Containers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" />
  <style>
    body { margin: 0px; height: 100%; width: 100%; }
    #map { position: absolute; width: 100%; top: 0px; bottom: 0; }

    /* North arrow style */
    .north-arrow {
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/8/8c/North_arrow.svg');
      background-size: contain;
      background-repeat: no-repeat;
      width: 50px;
      height: 50px;
      pointer-events: none; /* important to let map interactions pass through */
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <script>
    const mapOptions = {
      zoomSnap: 0.5,
      center: [31.9045, 35.2045],
      zoom: 17.5,
    };

    const map = L.map("map", mapOptions);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    L.control.scale({ position: 'bottomleft', imperial: false, maxWidth: 150 }).addTo(map);

    $.getJSON("RamallahZones.json", function(RZ) {
      L.geoJson(RZ, {
        style: function(feature) {
          return {
            fillColor: "yellow",
            fillOpacity: 0.3,
            color: "yellow",
            weight: 1.0,
            opacity: 0.7
          };
        },
        onEachFeature: function(feature, layer) {
          layer.on('click', function(e) {
            alert("Zone Name: " + feature.properties.NAME);
          });
        }
      }).addTo(map);
    });

    $.getJSON("wasteContainer.json", function(WC) {
      L.geoJson(WC, {
        pointToLayer: function(feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 5,
            fillColor: "orange",
            color: "orange",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          });
        }
      }).addTo(map);
    });

    // ===== Add North Arrow =====
    const NorthArrow = L.Control.extend({
      onAdd: function(map) {
        const div = L.DomUtil.create('div', 'north-arrow');
        return div;
      }
    });

    map.addControl(new NorthArrow({ position: 'topright' }));
  </script>
</body>
</html>
