<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ramallah Waste Containers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; height: 100%; width: 100%; }
    #map { position: absolute; width: 100%; top: 0; bottom: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <script>
    const map = L.map("map", {
      center: [31.9045, 35.2045],
      zoom: 17.5,
      zoomSnap: 0.5
    });

    // Base maps
    const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    const light = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    });

    // Load Ramallah Zones JSON
    $.getJSON("RamallahZones.json", function(RZ) {
      const RZLayer = L.geoJson(RZ, {
        style: function(feature) {
          return { fillColor: "yellow", fillOpacity: 0.3, color: "yellow", weight: 1, opacity: 0.7 };
        },
        onEachFeature: function(feature, layer) {
          layer.on('click', function() {
            alert("Zone Name: " + feature.properties.NAME);
          });
        }
      }).addTo(map);

      // Load Waste Containers JSON
      $.getJSON("wasteContainer.json", function(WC) {
        const WCLayer = L.geoJson(WC, {
          pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 5,
              fillColor: "orange",
              color: "orange",
              weight: 1,
              opacity: 1,
              fillOpacity: 0.8
            });
          }
        }).addTo(map);

        // Add Layer Control after all layers are loaded
        const baseMaps = { "Dark Map": dark, "Light Map": light };
        const overlayMaps = { "Ramallah Zones": RZLayer, "Waste Containers": WCLayer };
        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
      });
    });

    // Add scale control
    L.control.scale({ position: 'bottomleft', imperial: false, maxWidth: 150 }).addTo(map);
  </script>
</body>
</html>
