<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ramallah Waste Containers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" />
  <style>
    body { margin: 0px; height: 100%; width: 100%; }
    #map { position: absolute; width: 100%; top: 0px; bottom: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

  <script>
    // define map options
    const mapOptions = {
      zoomSnap: 0.5,
      center: [31.9045, 35.2045],
      zoom: 17.5
    };

    // define the map
    const map = L.map("map", mapOptions);

    // define base layers
    const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    });

    const light = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    });

    // add default layer (dark)
    dark.addTo(map);

    // === load GeoJSON zones ===
    let RZLayer;
    $.getJSON("RamallahZones.json", function(RZ) {
      RZLayer = L.geoJson(RZ, {
        style: function(feature) {
          return { fillColor: "yellow", fillOpacity: 0.3, color: "yellow", weight: 1.0, opacity: 0.7 };
        },
        onEachFeature: function(feature, layer) {
          layer.on('click', function(e) {
            alert("Zone Name: " + feature.properties.NAME);
          });
        }
      }).addTo(map);
    });

    // === load waste containers ===
    let WCLayer;
    $.getJSON("wasteContainer.json", function(WC) {
      WCLayer = L.geoJson(WC, {
        pointToLayer: function(feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 5,
            fillColor: "orange",
            color: "orange",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          });
        }
      }).addTo(map);
    });

    // === add layer control for Light/Dark toggle ===
    const baseMaps = {
      "Dark Map": dark,
      "Light Map": light
    };

    const overlayMaps = {
      "Ramallah Zones": RZLayer,
      "Waste Containers": WCLayer
    };

    L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

  </script>
</body>
</html>
